<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="frogSkin" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
    <radialGradient id="frogEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
  </defs>

  <!-- Rear Webbed Legs (Leaping pose) -->
  <path d="M8 24 C2 28 2 36 6 38 C10 38 12 32 14 28 Z" fill="#16A34A"/>
  <circle cx="6" cy="38" r="3" fill="#22C55E"/>
  <circle cx="3" cy="37" r="2" fill="#22C55E"/>
  <circle cx="9" cy="37" r="2" fill="#22C55E"/>

  <path d="M32 24 C38 28 38 36 34 38 C30 38 28 32 26 28 Z" fill="#16A34A"/>
  <circle cx="34" cy="38" r="3" fill="#22C55E"/>
  <circle cx="31" cy="37" r="2" fill="#22C55E"/>
  <circle cx="37" cy="37" r="2" fill="#22C55E"/>

  <!-- Front Webbed Arms -->
  <path d="M12 18 C6 14 4 8 8 6 C11 6 14 12 15 16 Z" fill="#22C55E"/>
  <circle cx="8" cy="6" r="2.5" fill="#4ADE80"/>
  <circle cx="5" cy="7" r="2" fill="#4ADE80"/>
  <circle cx="11" cy="7" r="2" fill="#4ADE80"/>

  <path d="M28 18 C34 14 36 8 32 6 C29 6 26 12 25 16 Z" fill="#22C55E"/>
  <circle cx="32" cy="6" r="2.5" fill="#4ADE80"/>
  <circle cx="29" cy="7" r="2" fill="#4ADE80"/>
  <circle cx="35" cy="7" r="2" fill="#4ADE80"/>

  <!-- Frog Torso & Head -->
  <ellipse cx="20" cy="22" rx="13" ry="11" fill="url(#frogSkin)"/>
  
  <!-- Back Spots -->
  <circle cx="16" cy="24" r="2.2" fill="#14532D" opacity="0.6"/>
  <circle cx="24" cy="25" r="2.5" fill="#14532D" opacity="0.6"/>
  <circle cx="20" cy="28" r="1.8" fill="#14532D" opacity="0.6"/>

  <!-- Pale Yellow Back Highlight Line -->
  <path d="M20 14 V30" stroke="#86EFAC" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Big Bulging Frog Eyes -->
  <!-- Left Eye -->
  <circle cx="13" cy="12" r="5.5" fill="#16A34A"/>
  <circle cx="13" cy="12" r="4.5" fill="url(#frogEye)"/>
  <ellipse cx="13" cy="12" rx="2" ry="3.5" fill="#0F172A"/>
  <circle cx="12" cy="10.5" r="1.2" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <circle cx="27" cy="12" r="5.5" fill="#16A34A"/>
  <circle cx="27" cy="12" r="4.5" fill="url(#frogEye)"/>
  <ellipse cx="27" cy="12" rx="2" ry="3.5" fill="#0F172A"/>
  <circle cx="26" cy="10.5" r="1.2" fill="#FFFFFF"/>

  <!-- Snout / Nostrils -->
  <circle cx="18.5" cy="10" r="0.8" fill="#14532D"/>
  <circle cx="21.5" cy="10" r="0.8" fill="#14532D"/>
</svg>
