<svg width="40" height="30" viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="shellGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <radialGradient id="turtleHead" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>
  </defs>

  <!-- Water Ripples -->
  <ellipse cx="20" cy="15" rx="19" ry="13" fill="#0284C7" opacity="0.3"/>

  <!-- Flippers (Swimming) -->
  <!-- Front Flippers -->
  <path d="M26 8 C32 4 36 2 35 7 C34 11 30 11 26 10 Z" fill="#22C55E"/>
  <path d="M26 22 C32 26 36 28 35 23 C34 19 30 19 26 20 Z" fill="#22C55E"/>
  
  <!-- Rear Flippers -->
  <path d="M10 8 C6 5 3 4 4 8 C5 11 8 11 10 10 Z" fill="#16A34A"/>
  <path d="M10 22 C6 25 3 26 4 22 C5 19 8 19 10 20 Z" fill="#16A34A"/>

  <!-- Turtle Head -->
  <circle cx="33" cy="15" r="4.5" fill="url(#turtleHead)"/>
  <circle cx="34.5" cy="13.5" r="1.2" fill="#0F172A"/>
  <circle cx="34.5" cy="16.5" r="1.2" fill="#0F172A"/>
  <circle cx="35" cy="13.2" r="0.4" fill="#FFFFFF"/>
  <circle cx="35" cy="16.2" r="0.4" fill="#FFFFFF"/>

  <!-- Tiny Tail -->
  <polygon points="6,13 3,15 6,17" fill="#16A34A"/>

  <!-- Carapace / Shell -->
  <ellipse cx="18" cy="15" rx="12" ry="10" fill="url(#shellGrad)"/>
  <ellipse cx="18" cy="15" rx="11" ry="9" stroke="#FDE047" stroke-width="1" fill="none"/>

  <!-- Shell Scutes Pattern -->
  <polygon points="18,10 22,12 22,18 18,20 14,18 14,12" fill="#16A34A" stroke="#FDE047" stroke-width="0.8"/>
  <polygon points="11,12 14,12 14,18 11,18" fill="#15803D" stroke="#FDE047" stroke-width="0.8"/>
  <polygon points="22,12 25,12 25,18 22,18" fill="#15803D" stroke="#FDE047" stroke-width="0.8"/>
</svg>
