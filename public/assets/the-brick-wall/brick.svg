<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tBlock" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="cBlock" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="yBlock" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Cyan Block -->
  <rect x="4" y="24" width="18" height="18" rx="3" fill="url(#cBlock)" stroke="#BAE6FD" stroke-width="1.5"/>
  <rect x="7" y="27" width="12" height="12" rx="1.5" fill="#38BDF8" opacity="0.6"/>

  <!-- Yellow Block -->
  <rect x="24" y="24" width="18" height="18" rx="3" fill="url(#yBlock)" stroke="#FEF08A" stroke-width="1.5"/>
  <rect x="27" y="27" width="12" height="12" rx="1.5" fill="#FACC15" opacity="0.6"/>

  <!-- Purple Top Block -->
  <rect x="14" y="6" width="18" height="18" rx="3" fill="url(#tBlock)" stroke="#E9D5FF" stroke-width="1.5"/>
  <rect x="17" y="9" width="12" height="12" rx="1.5" fill="#C084FC" opacity="0.6"/>

  <!-- Neon Glow Shimmer Sparks -->
  <circle cx="15" cy="7" r="1.5" fill="#FFFFFF"/>
  <circle cx="25" cy="25" r="1.5" fill="#FFFFFF"/>
</svg>
