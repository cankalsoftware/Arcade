<svg width="40" height="30" viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carRed" x1="0" y1="0" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Tires -->
  <rect x="5" y="2" width="6" height="5" rx="1.5" fill="#0F172A"/>
  <rect x="29" y="2" width="6" height="5" rx="1.5" fill="#0F172A"/>
  <rect x="5" y="23" width="6" height="5" rx="1.5" fill="#0F172A"/>
  <rect x="29" y="23" width="6" height="5" rx="1.5" fill="#0F172A"/>

  <!-- Car Chassis (Top-Down View) -->
  <rect x="3" y="5" width="34" height="20" rx="6" fill="url(#carRed)"/>
  
  <!-- Racing Stripe -->
  <rect x="3" y="13" width="34" height="4" fill="#FEF08A"/>

  <!-- Windshield Front -->
  <path d="M25 7 H30 C32 7 33 8 33 11 V19 C33 22 32 23 30 23 H25 C24 23 23 21 23 19 V11 C23 9 24 7 25 7 Z" fill="url(#windshield)"/>
  <path d="M26 8 L31 15" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Rear Window -->
  <rect x="9" y="8" width="5" height="14" rx="2" fill="url(#windshield)"/>

  <!-- Roof -->
  <rect x="15" y="7" width="8" height="16" rx="2" fill="#DC2626"/>

  <!-- Headlights -->
  <rect x="35" y="6" width="2" height="4" rx="1" fill="#FEF08A"/>
  <rect x="35" y="20" width="2" height="4" rx="1" fill="#FEF08A"/>

  <!-- Taillights -->
  <rect x="3" y="6" width="2" height="4" rx="1" fill="#7F1D1D"/>
  <rect x="3" y="20" width="2" height="4" rx="1" fill="#7F1D1D"/>
</svg>
