<svg width="40" height="70" viewBox="0 0 40 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="raceRed" x1="0" y1="0" x2="40" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="raceCockpit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Underglow Neon -->
  <ellipse cx="20" cy="35" rx="18" ry="30" fill="url(#neonGlow)"/>

  <!-- Wheels (Tires with Rims) -->
  <!-- Front Left -->
  <rect x="2" y="10" width="6" height="14" rx="2" fill="#0F172A"/>
  <rect x="3" y="13" width="4" height="8" rx="1" fill="#94A3B8"/>
  <!-- Front Right -->
  <rect x="32" y="10" width="6" height="14" rx="2" fill="#0F172A"/>
  <rect x="33" y="13" width="4" height="8" rx="1" fill="#94A3B8"/>
  <!-- Rear Left -->
  <rect x="1" y="46" width="7" height="16" rx="2" fill="#0F172A"/>
  <rect x="2" y="49" width="5" height="10" rx="1" fill="#94A3B8"/>
  <!-- Rear Right -->
  <rect x="32" y="46" width="7" height="16" rx="2" fill="#0F172A"/>
  <rect x="33" y="49" width="5" height="10" rx="1" fill="#94A3B8"/>

  <!-- Aerodynamic Main Body / Chassis -->
  <path d="M12 6 C12 3 16 2 20 2 C24 2 28 3 28 6 L33 22 L35 56 C35 62 31 64 20 64 C9 64 5 62 5 56 L7 22 Z" fill="url(#raceRed)"/>

  <!-- Front Nose Cone -->
  <path d="M14 6 C14 3 17 2 20 2 C23 2 26 3 26 6 L27 16 H13 Z" fill="#B91C1C"/>

  <!-- Racing White Center Stripes -->
  <rect x="18" y="2" width="4" height="62" fill="#FFFFFF" opacity="0.9"/>

  <!-- Cockpit & Windshield -->
  <path d="M14 24 C14 20 17 18 20 18 C23 18 26 20 26 24 L27 38 C27 41 24 43 20 43 C16 43 13 41 13 38 Z" fill="url(#raceCockpit)"/>
  <ellipse cx="18" cy="27" rx="2" ry="5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Driver Helmet -->
  <circle cx="20" cy="31" r="3.5" fill="#FACC15"/>
  <rect x="19" y="29" width="3" height="2" rx="0.5" fill="#000000"/>

  <!-- Side Air Intakes -->
  <path d="M7 32 L11 34 V44 L7 46 Z" fill="#1E293B"/>
  <path d="M33 32 L29 34 V44 L33 46 Z" fill="#1E293B"/>

  <!-- Rear Spoiler Wing -->
  <rect x="3" y="60" width="34" height="6" rx="2" fill="#1E293B"/>
  <rect x="5" y="61" width="30" height="2" fill="#EF4444"/>

  <!-- Headlights -->
  <polygon points="12,4 15,4 14,8 11,8" fill="#FEF08A"/>
  <polygon points="28,4 25,4 26,8 29,8" fill="#FEF08A"/>

  <!-- Exhaust Flame Spits -->
  <polygon points="13,66 16,66 14.5,70" fill="#F97316"/>
  <polygon points="24,66 27,66 25.5,70" fill="#F97316"/>
</svg>
