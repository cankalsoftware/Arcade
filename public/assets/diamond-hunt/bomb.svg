<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bombBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="40%" stop-color="#1F2937"/>
      <stop offset="85%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="24" cy="43" rx="14" ry="3.5" fill="#000000" opacity="0.4"/>

  <!-- Bomb Spherical Body -->
  <circle cx="24" cy="27" r="16" fill="url(#bombBody)"/>

  <!-- Specular Light Reflection -->
  <ellipse cx="19" cy="18" rx="6" ry="3" transform="rotate(-30 19 18)" fill="#9CA3AF" opacity="0.5"/>

  <!-- Metal Cap / Collar -->
  <rect x="20" y="9" width="8" height="4" rx="1.5" fill="#4B5563"/>
  <rect x="21" y="9" width="6" height="1.5" fill="#9CA3AF"/>

  <!-- Curved Burning Fuse -->
  <path d="M24 9 Q28 4 35 6" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Fiery Spark at Fuse Tip -->
  <circle cx="35" cy="6" r="6" fill="url(#sparkGlow)"/>
  <polygon points="35,1 36.5,4.5 40,6 36.5,7.5 35,11 33.5,7.5 30,6 33.5,4.5" fill="#FFFFFF"/>
  <polygon points="35,3 36,5 38,6 36,7 35,9 34,7 32,6 34,5" fill="#FDE047"/>

  <!-- Skull / Hazard Icon on Bomb -->
  <circle cx="24" cy="27" r="4.5" fill="#EF4444" opacity="0.8"/>
  <rect x="22" y="29.5" width="4" height="2" rx="0.5" fill="#EF4444" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="22.5" cy="26.5" r="1" fill="#111827"/>
  <circle cx="25.5" cy="26.5" r="1" fill="#111827"/>
</svg>
