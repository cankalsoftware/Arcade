<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="barrelWood" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="45%" stop-color="#B45309"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
    <linearGradient id="metalBand" x1="0" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Rolling Barrel Body -->
  <circle cx="20" cy="20" r="19" fill="url(#barrelWood)"/>
  
  <!-- Outer Rim Ring -->
  <circle cx="20" cy="20" r="18" stroke="#451A03" stroke-width="2" fill="none"/>

  <!-- Metal Bands (Concentrics) -->
  <circle cx="20" cy="20" r="13" stroke="url(#metalBand)" stroke-width="3" fill="none"/>
  
  <!-- Center Core -->
  <circle cx="20" cy="20" r="6" fill="#78350F"/>
  <circle cx="20" cy="20" r="4" fill="#451A03"/>

  <!-- Wood Planks Spokes -->
  <line x1="20" y1="2" x2="20" y2="38" stroke="#451A03" stroke-width="2"/>
  <line x1="2" y1="20" x2="38" y2="20" stroke="#451A03" stroke-width="2"/>
  <line x1="7" y1="7" x2="33" y2="33" stroke="#451A03" stroke-width="1.5"/>
  <line x1="7" y1="33" x2="33" y2="7" stroke="#451A03" stroke-width="1.5"/>

  <!-- Rivets on Metal Band -->
  <circle cx="20" cy="7" r="1.5" fill="#E2E8F0"/>
  <circle cx="20" cy="33" r="1.5" fill="#E2E8F0"/>
  <circle cx="7" cy="20" r="1.5" fill="#E2E8F0"/>
  <circle cx="33" cy="20" r="1.5" fill="#E2E8F0"/>

  <!-- Highlight Arc -->
  <path d="M8 12 Q20 4 32 12" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
