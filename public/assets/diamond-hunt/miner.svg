<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helmetGrad" x1="12" y1="4" x2="36" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEA00"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="lampGrad" x1="24" y1="6" x2="24" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="14" y1="20" x2="34" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Headlamp Glow effect behind -->
  <circle cx="24" cy="9" r="10" fill="url(#lampGlow)" filter="url(#glow)"/>

  <!-- Boots -->
  <rect x="13" y="38" width="9" height="8" rx="3" fill="url(#bootGrad)"/>
  <rect x="26" y="38" width="9" height="8" rx="3" fill="url(#bootGrad)"/>
  <rect x="11" y="42" width="12" height="4" rx="2" fill="#7F1D1D"/>
  <rect x="25" y="42" width="12" height="4" rx="2" fill="#7F1D1D"/>

  <!-- Overalls Legs & Body -->
  <path d="M14 24 H34 V38 C34 40 32 40 30 40 H26 V32 H22 V40 H18 C16 40 14 40 14 38 Z" fill="url(#suitGrad)"/>
  
  <!-- Belt & Buckle -->
  <rect x="14" y="27" width="20" height="4" rx="1" fill="#78350F"/>
  <rect x="22" y="26" width="4" height="6" rx="1" fill="#FCD34D"/>

  <!-- Red Shirt Sleeves -->
  <rect x="8" y="21" width="7" height="9" rx="3" fill="#DC2626"/>
  <rect x="33" y="21" width="7" height="9" rx="3" fill="#DC2626"/>
  
  <!-- Hands / Mining Gloves -->
  <circle cx="11" cy="30" r="3.5" fill="#F59E0B"/>
  <circle cx="37" cy="30" r="3.5" fill="#F59E0B"/>

  <!-- Face & Head -->
  <rect x="15" y="11" width="18" height="13" rx="5" fill="#FED7AA"/>
  <!-- Eyes -->
  <circle cx="19" cy="17" r="2.5" fill="#1F2937"/>
  <circle cx="19.8" cy="16.2" r="0.8" fill="#FFFFFF"/>
  <circle cx="29" cy="17" r="2.5" fill="#1F2937"/>
  <circle cx="29.8" cy="16.2" r="0.8" fill="#FFFFFF"/>
  <!-- Friendly Mustache / Nose -->
  <ellipse cx="24" cy="18" rx="2.5" ry="1.8" fill="#F97316"/>
  <path d="M18 21 Q24 23 30 21" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>

  <!-- Mining Hardhat -->
  <path d="M11 12 C11 5 17 3 24 3 C31 3 37 5 37 12 C37 14 35 15 24 15 C13 15 11 14 11 12 Z" fill="url(#helmetGrad)"/>
  <path d="M9 12 C9 11 13 11 24 11 C35 11 39 11 39 12 C39 14 36 15 24 15 C12 15 9 14 9 12 Z" fill="#D97706"/>
  <rect x="21.5" y="3" width="5" height="9" fill="#F59E0B" rx="1"/>

  <!-- Mining Headlamp on Helmet -->
  <rect x="21" y="6" width="6" height="6" rx="2" fill="#374151"/>
  <circle cx="24" cy="9" r="2.5" fill="url(#lampGrad)"/>
  <circle cx="24.5" cy="8.5" r="1" fill="#FFFFFF"/>
</svg>
