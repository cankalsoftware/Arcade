<svg width="40" height="70" viewBox="0 0 40 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="raceBlue" x1="0" y1="0" x2="40" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="raceCockpitB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neonGlowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cyan Underglow Neon -->
  <ellipse cx="20" cy="35" rx="18" ry="30" fill="url(#neonGlowB)"/>

  <!-- Wheels (Tires with Rims) -->
  <rect x="2" y="10" width="6" height="14" rx="2" fill="#0F172A"/>
  <rect x="3" y="13" width="4" height="8" rx="1" fill="#38BDF8"/>
  <rect x="32" y="10" width="6" height="14" rx="2" fill="#0F172A"/>
  <rect x="33" y="13" width="4" height="8" rx="1" fill="#38BDF8"/>
  <rect x="1" y="46" width="7" height="16" rx="2" fill="#0F172A"/>
  <rect x="2" y="49" width="5" height="10" rx="1" fill="#38BDF8"/>
  <rect x="32" y="46" width="7" height="16" rx="2" fill="#0F172A"/>
  <rect x="33" y="49" width="5" height="10" rx="1" fill="#38BDF8"/>

  <!-- Sleek Cruiser Body -->
  <path d="M13 5 C13 2 17 1 20 1 C23 1 27 2 27 5 L34 22 L35 56 C35 62 31 64 20 64 C9 64 5 62 5 56 L6 22 Z" fill="url(#raceBlue)"/>

  <!-- Neon Cyan Accent Trim -->
  <path d="M9 20 L13 8 L17 4" stroke="#00FFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M31 20 L27 8 L23 4" stroke="#00FFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Center Double White Pinstripes -->
  <line x1="18" y1="2" x2="18" y2="64" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
  <line x1="22" y1="2" x2="22" y2="64" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>

  <!-- Tinted Glass Canopy Cockpit -->
  <path d="M14 22 C14 18 17 16 20 16 C23 16 26 18 26 22 L27 38 C27 41 24 43 20 43 C16 43 13 41 13 38 Z" fill="url(#raceCockpitB)"/>
  <ellipse cx="18" cy="25" rx="2" ry="5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Driver Helmet -->
  <circle cx="20" cy="30" r="3.5" fill="#FFFFFF"/>
  <rect x="19" y="28" width="3" height="2" rx="0.5" fill="#0284C7"/>

  <!-- Carbon Fiber Spoiler -->
  <rect x="3" y="60" width="34" height="6" rx="2" fill="#0F172A"/>
  <rect x="5" y="61" width="30" height="2" fill="#38BDF8"/>

  <!-- LED Light Strips -->
  <polygon points="12,3 16,3 15,6 11,6" fill="#00FFFF"/>
  <polygon points="28,3 24,3 25,6 29,6" fill="#00FFFF"/>

  <!-- Nitro Blue Flame -->
  <polygon points="17,66 20,70 23,66" fill="#00FFFF"/>
</svg>
